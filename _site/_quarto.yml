page-layout: full

website:
  page-navigation: true
  back-to-top-navigation: true
  title: "tidyMacro"
  site-url: "https://tidymacro.netlify.app"
  repo-url: https://github.com/muhsinciftci/tidyMacro
  repo-subdir: _site
  repo-actions: [edit, issue]
  favicon: logo.png

  open-graph:
    title: "tidyMacro"
    description: "High-Performance Structural Vector Autoregressions (SVARs) and Local Projections in R"

  page-footer:
    right: "This page is built with [Quarto](https://quarto.org)."
    left: "&copy; 2025 Muhsin Ciftci · Goethe University Frankfurt"

  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: faq.qmd
        text: FAQ

  sidebar:
    logo: "logo.png"
    pinned: true
    align: center
    tools:
      - icon: github
        href: https://github.com/muhsinciftci/tidyMacro
        text: "tidyMacro GitHub"
      - icon: file-pdf
        href: https://papers.ssrn.com/sol3/papers.cfm?abstract_id=7150339
        text: "Paper"
      - icon: linkedin
        href: https://www.linkedin.com/in/muhsin-ciftci/
        text: Linkedin
    style: "docked"
    search: true
    collapse-level: 1
    contents:
      - href: index.qmd
        text: Welcome
        
      - href: 01_Bloom2009.qmd
        text: Identifcation via Short-run restrictions
        
      - href: 02_1_Gali1999.qmd
        text: Identifcation via Long-run restrictions
        
      - href: 02_2_BeaudryPortier2014.qmd
        text: Identifcation via Mixed restrictions
        
      - href: 03_1_Kaenzig2021_ExternalIV.qmd
        text: Identifcation via External Instruments and Weak IV
        
      - href: 04_ForniGambettiRicco.qmd
        text: Identifcation via Noninvertible shocks
        
      - href: 03_3_Kaenzig2021_InternalIV.qmd
        text: Identifcation via Internal instruments
        
      - href: 03_2_Kaenzig2021_Hetero.qmd
        text: Identifcation via Heteroskedasticity
        
      - href: 05_01_lp_primer.qmd
        text: LP Primer

      - href: 05_2_lp_syntax_primer.qmd
        text: LP Syntax Primer
        
