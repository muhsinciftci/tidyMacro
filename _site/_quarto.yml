format:
  html:
    theme: cosmo
    code-copy: true
    code-overflow: wrap
    toc: true
    toc-expand: true
    toc-depth: 3
    code-fold: false
    highlight-style: github
    smooth-scroll: true
    link-external-newwindow: true
    number-sections: true

execute:
  freeze: auto
  warning: false
  message: false
