project:
  type: book
  output-dir: ../docs

page-layout: full

book:
  title: "tidyMacro"
  subtitle: "High-Performance Vector Autoregressions and Local Projections in R"
  #description: "Replication gallery and documentation for the tidyMacro R package"
  author:
    - name: Muhsin Ciftci
      url: https://mciftci.netlify.app
      affiliation: Goethe University Frankfurt
  date: today
  favicon: logo.png
  cover-image: logo.png

  navbar:
    background: "#33302E"
    foreground: "#FFF1E5"
    logo: logo.png
    logo-alt: "tidyMacro"
    title: true
    pinned: true

  sidebar:
    style: docked
    background: "#FAF4ED"
    #collapse-level: 1

  chapters:
    - index.qmd
    - part: "Chapters"
      chapters:
        - 01_Bloom2009.qmd
        - 02_1_Gali1999.qmd
        - 02_2_BeaudryPortier2014.qmd
        - 03_1_Kaenzig2021_ExternalIV.qmd
        - 03_2_Kaenzig2021_Hetero.qmd
        - 03_3_Kaenzig2021_InternalIV.qmd
        - 04_ForniGambettiRicco.qmd
        - 05_JordaTaylor2025.qmd
        - 06_AlmuzaraSancibrian2024.qmd
        - 07_Dube2025.qmd
  page-footer:
    left: "Built with [Quarto](https://quarto.org)"
    center: "© 2025 Muhsin Ciftci · Goethe University Frankfurt"
    right: "[tidyMacro](index.qmd)"
    background: "#33302E"
    foreground: "#FFF1E5"

  page-navigation: true
  back-to-top-navigation: true

  repo-url: https://github.com/muhsinciftci/tidyMacro
  repo-actions: [edit, issue]

  open-graph:
    title: "tidyMacro"
    description: "High-Performance Structural Vector Autoregressions (SVARs) and Local Projections in R"

format:
  html:
    #theme: [cosmo, styles.scss]
    theme: [cosmo]
    toc: false
    toc-expand: true
    toc-depth: 3
    code-fold: false
    highlight-style: github
    smooth-scroll: true
    link-external-newwindow: true
    number-sections: true

execute:
  freeze: auto
  warning: false
  message: false
